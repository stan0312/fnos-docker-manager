name: iOS Build (IPA)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置 Debug / Release'
        required: false
        default: 'Release'
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Ensure signing config
        run: |
          if [ ! -f iosApp/Configuration/Config.xcconfig ]; then
            cp iosApp/Configuration/Config.xcconfig.example iosApp/Configuration/Config.xcconfig
          fi

      - name: Build Kotlin framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon

      - name: Build iOS app with Xcode (simulator, smoke test)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive for device (Release)
        if: github.event.inputs.configuration == 'Release' || startsWith(github.ref, 'refs/tags/v')
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          mkdir -p build
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" exportOptions.plist > build/exportOptions.plist
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE="Automatic"
          xcodebuild -exportArchive -archivePath build/iosApp.xcarchive \
            -exportOptionsPlist build/exportOptions.plist \
            -exportPath build/export

      - name: Upload IPA artifact
        if: github.event.inputs.configuration == 'Release' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: fnos-docker-manager-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Create GitHub Release (备用分发通道)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/export/*.ipa
            exportOptions.plist
